<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>สรุปยอด - น้องจด</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Prompt', sans-serif; background-color: #FDF2F8; }
    input, select, textarea { font-size: 16px !important; }
  </style>
</head>
<body class="p-4 text-gray-800 max-w-md mx-auto min-h-screen">

  <!-- Header Profile -->
  <div class="flex items-center space-x-3 bg-white p-4 rounded-2xl shadow-sm mb-4 border border-pink-100">
    <img id="userPicture" class="w-12 h-12 rounded-full border-2 border-pink-400 bg-pink-50 object-cover" src="https://via.placeholder.com/150" alt="Profile" crossorigin="anonymous">
    <div>
      <h2 id="userName" class="font-bold text-lg leading-tight text-gray-800">กำลังโหลด...</h2>
    </div>
  </div>

  <!-- Dashboard สรุปยอด -->
  <div class="bg-white p-5 rounded-2xl shadow-sm mb-4 border border-pink-100">
    <div class="flex justify-between items-center mb-4">
      <h3 class="font-bold text-lg text-purple-900">📊 สรุปยอด</h3>
      <div class="relative">
        <select id="timeFilter" onchange="applyFilter()" class="bg-pink-50 border border-pink-200 text-pink-600 font-semibold text-xs rounded-xl px-2.5 py-1.5 focus:outline-none focus:ring-2 focus:ring-pink-300 cursor-pointer">
          <option value="daily">📅 รายวัน</option>
          <option value="weekly">📅 รายสัปดาห์</option>
          <option value="monthly">📅 รายเดือน</option>
          <option value="all" selected>📅 ทั้งหมด</option>
        </select>
      </div>
    </div>

    <!-- ยอดคงเหลือสุทธิ -->
    <div class="bg-[#E6007E] p-5 rounded-2xl mb-4 text-center text-white shadow-md">
      <p class="text-xs opacity-90 mb-1 font-light">เหลือเก็บสุทธิ</p>
      <h1 id="netTotal" class="text-3xl font-extrabold tracking-tight">฿0.00</h1>
    </div>

    <!-- การ์ดแยก รายรับ / รายจ่าย -->
    <div class="grid grid-cols-2 gap-3 mb-5">
      <div class="bg-sky-50 p-3.5 rounded-xl border border-sky-100 text-center">
        <p class="text-xs text-sky-600 mb-1 font-medium">💰 รายรับรวม</p>
        <p id="totalIncome" class="text-lg font-bold text-sky-600">฿0.00</p>
      </div>
      <div class="bg-pink-50 p-3.5 rounded-xl border border-pink-100 text-center">
        <p class="text-xs text-pink-600 mb-1 font-medium">💸 รายจ่ายรวม</p>
        <p id="totalExpense" class="text-lg font-bold text-pink-600">฿0.00</p>
      </div>
    </div>

    <!-- แผนภูมิวงกลม -->
    <div class="pt-2 border-t border-pink-50">
      <p class="text-xs font-semibold text-purple-800 mb-3 text-center">สัดส่วนทางการเงิน</p>
      <div class="w-52 h-52 mx-auto relative flex items-center justify-center">
        <canvas id="financeChart"></canvas>
        <div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none pb-6">
          <span class="text-[11px] text-gray-400 font-medium">รายการช่วงนี้</span>
          <span id="totalItemsCount" class="text-2xl font-black text-purple-900 leading-none">0</span>
          <span class="text-[10px] text-gray-400">รายการ</span>
        </div>
      </div>
    </div>
  </div>

  <!-- รายการล่าสุด -->
  <div class="bg-white p-5 rounded-2xl shadow-sm mb-6 border border-pink-100">
    <div class="flex justify-between items-center mb-3">
      <h3 class="font-bold text-md text-purple-900">📝 รายการล่าสุด</h3>
      <span class="text-[10px] text-gray-400">กดที่รายการเพื่อแก้ไข/ลบ</span>
    </div>

    <div id="itemList" class="space-y-2.5 max-h-80 overflow-y-auto pr-1">
      <p class="text-center text-xs text-gray-400 py-4">กำลังโหลดรายการ...</p>
    </div>
  </div>

  <!-- Modal แก้ไขรายการ -->
  <div id="editModal" class="fixed inset-0 bg-purple-950/40 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4 hidden z-50">
    <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl p-6 shadow-2xl border border-pink-100">
      <div class="flex justify-between items-center mb-4 border-b border-pink-100 pb-3">
        <h3 class="font-bold text-lg text-purple-900">✏️ แก้ไขรายการ</h3>
        <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 font-bold text-xl">&times;</button>
      </div>

      <input type="hidden" id="editRowIndex">

      <div class="space-y-4 text-sm">
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">ประเภทรายการ</label>
          <div class="grid grid-cols-2 gap-2">
            <button type="button" id="btnTypeExpense" onclick="setType('รายจ่าย')" class="py-2.5 rounded-xl font-medium border text-center border-pink-500 bg-pink-50 text-pink-600">รายจ่าย</button>
            <button type="button" id="btnTypeIncome" onclick="setType('รายรับ')" class="py-2.5 rounded-xl font-medium border text-center border-gray-200 text-gray-600">รายรับ</button>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">หมวดหมู่ / รายรายละเอียด</label>
          <input type="text" id="editCategory" class="w-full p-3 border border-pink-100 rounded-xl focus:outline-none focus:border-pink-400">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">จำนวนเงิน (บาท)</label>
          <input type="number" step="any" id="editAmount" class="w-full p-3 border border-pink-100 rounded-xl focus:outline-none focus:border-pink-400 font-bold text-pink-600">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">วันที่และเวลา</label>
          <input type="datetime-local" id="editDate" class="w-full p-3 border border-pink-100 rounded-xl focus:outline-none focus:border-pink-400 text-gray-700 bg-white">
        </div>
      </div>

      <div class="flex space-x-2 mt-6">
        <button onclick="saveItem()" class="flex-[2] py-3 bg-[#E6007E] hover:bg-pink-700 text-white font-semibold rounded-xl shadow-md transition">บันทึก</button>
        <button onclick="deleteItem()" class="flex-1 py-3 bg-red-50 hover:bg-red-100 text-red-500 font-semibold rounded-xl transition">🗑️ ลบ</button>
      </div>
    </div>
  </div>

  <script>
    const WORKER_URL = "https://nongjod.hay-peerapattx-co-th.workers.dev/";
    let currentType = "รายจ่าย";
    let myChart = null;
    let rawAllItems = [];

    async function main() {
      try {
        await liff.init({ liffId: "2009228308-x4y4D63m" });
        if (!liff.isLoggedIn()) {
          liff.login();
        } else {
          const profile = await liff.getProfile();
          document.getElementById("userName").innerText = profile.displayName;
          if (profile.pictureUrl) {
            document.getElementById("userPicture").src = profile.pictureUrl;
          }
        }
      } catch (err) {
        console.log("LIFF Error:", err);
        document.getElementById("userName").innerText = "ผู้ใช้งานน้องจด";
      }

      fetchData();
    }

    async function fetchData() {
      try {
        const res = await fetch(WORKER_URL);
        const data = await res.json();
        rawAllItems = data.items || [];
        applyFilter();
      } catch (e) {
        console.error("Fetch Data Error:", e);
      }
    }

    // ฟังก์ชันถอดรหัสวันที่แบบรองรับ 3/8/69 และ 03/08/2026
    function getItemDateObj(dateStr) {
      if (!dateStr) return null;
      try {
        let str = String(dateStr).trim();
        let datePart = str.split(' ')[0]; // เอาเฉพาะส่วนวันที่ ตัดเวลาออก
        let day, month, year;

        if (datePart.includes('/')) {
          const parts = datePart.split('/');
          day = parseInt(parts[0], 10);
          month = parseInt(parts[1], 10);
          year = parseInt(parts[2], 10);
        } else if (datePart.includes('-')) {
          const parts = datePart.split('-');
          if (parts[0].length === 4) {
            year = parseInt(parts[0], 10);
            month = parseInt(parts[1], 10);
            day = parseInt(parts[2], 10);
          } else {
            day = parseInt(parts[0], 10);
            month = parseInt(parts[1], 10);
            year = parseInt(parts[2], 10);
          }
        }

        if (isNaN(day) || isNaN(month) || isNaN(year)) return null;

        // แปลงปี 2 หลัก เช่น 69 ให้กลายเป็น ค.ศ. 2026
        if (year < 100) {
          year = 2000 + (year - 43); // 69 พ.ศ. -> 26 ค.ศ.
        } else if (year > 2400) {
          year -= 543; // แปลง พ.ศ. 2569 -> 2026
        }

        return new Date(year, month - 1, day);
      } catch (e) {
        return null;
      }
    }

    function applyFilter() {
      const filterType = document.getElementById("timeFilter").value;
      const now = new Date();
      const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();

      let filteredItems = rawAllItems.filter(item => {
        if (filterType === 'all') return true;
        
        const itemDate = getItemDateObj(item.date);
        if (!itemDate) return true; 

        const itemDateTime = new Date(itemDate.getFullYear(), itemDate.getMonth(), itemDate.getDate()).getTime();

        if (filterType === 'daily') {
          // ตรงกับวันนี้เป๊ะๆ
          return itemDateTime === todayStart;
        } else if (filterType === 'weekly') {
          // ย้อนหลัง 7 วันจากวันนี้
          const sevenDaysAgo = todayStart - (6 * 24 * 60 * 60 * 1000);
          return itemDateTime >= sevenDaysAgo;
        } else if (filterType === 'monthly') {
          // เดือนเดียวกัน และปีเดียวกัน
          return itemDate.getFullYear() === now.getFullYear() && itemDate.getMonth() === now.getMonth();
        }
        return true;
      });

      // คำนวณยอดรวมใหม่
      let totalIncome = 0;
      let totalExpense = 0;

      filteredItems.forEach(item => {
        const amt = Number(item.amount) || 0;
        if (item.type === "รายรับ") {
          totalIncome += amt;
        } else {
          totalExpense += amt;
        }
      });

      const netTotal = totalIncome - totalExpense;

      // อัปเดตตัวเลขบน UI
      document.getElementById("totalIncome").innerText = `฿${totalIncome.toLocaleString()}`;
      document.getElementById("totalExpense").innerText = `฿${totalExpense.toLocaleString()}`;
      document.getElementById("netTotal").innerText = `฿${netTotal.toLocaleString()}`;
      document.getElementById("totalItemsCount").innerText = filteredItems.length.toLocaleString();

      renderChart(totalIncome, totalExpense);
      renderItemList(filteredItems);
    }

    function renderChart(income, expense) {
      const ctx = document.getElementById('financeChart').getContext('2d');
      if (myChart) myChart.destroy();

      let chartIncome = income;
      let chartExpense = expense;

      if (income === 0 && expense === 0) {
        chartIncome = 1; 
      }

      myChart = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: ['รายรับ', 'รายจ่าย'],
          datasets: [{
            data: [chartIncome, chartExpense],
            backgroundColor: ['#38BDF8', '#E6007E'],
            borderWidth: 2,
            borderColor: '#ffffff'
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { position: 'bottom', labels: { font: { family: 'Prompt', size: 11 } } }
          },
          cutout: '75%'
        }
      });
    }

    function renderItemList(items) {
      const listEl = document.getElementById("itemList");
      if (!items || items.length === 0) {
        listEl.innerHTML = '<p class="text-center text-xs text-gray-400 py-4">ไม่มีรายการในช่วงเวลานี้</p>';
        return;
      }

      listEl.innerHTML = items.map(item => {
        const isIncome = item.type === "รายรับ";
        const colorClass = isIncome ? "text-sky-600 bg-sky-50" : "text-pink-600 bg-pink-50";
        const amountSign = isIncome ? "+" : "-";

        return `
          <div onclick='openEditModal(${JSON.stringify(item)})' class="flex justify-between items-center p-3 rounded-xl border border-pink-50 hover:border-pink-200 cursor-pointer active:scale-98 transition bg-white">
            <div>
              <p class="font-semibold text-sm text-gray-800">${item.category}</p>
              <p class="text-[10px] text-gray-400">${item.date}</p>
            </div>
            <div class="text-right">
              <span class="text-sm font-bold ${colorClass} px-2.5 py-1 rounded-lg">
                ${amountSign}฿${Number(item.amount).toLocaleString()}
              </span>
            </div>
          </div>
        `;
      }).join('');
    }

    function parseDateToInput(dateStr) {
      if (!dateStr) return '';
      try {
        let str = String(dateStr).trim();
        let timePart = '00:00';

        if (str.includes(' ')) {
          const parts = str.split(/\s+/);
          timePart = parts[parts.length - 1];
          if (timePart.includes(':')) {
            str = parts.slice(0, -1).join(' ');
          } else {
            timePart = '00:00';
          }
        }

        let day, month, year;
        if (str.includes('/')) {
          const parts = str.split('/');
          day = parseInt(parts[0], 10);
          month = parseInt(parts[1], 10);
          year = parseInt(parts[2], 10);
        } else if (str.includes('-')) {
          const parts = str.split('-');
          if (parts[0].length === 4) {
            year = parseInt(parts[0], 10);
            month = parseInt(parts[1], 10);
            day = parseInt(parts[2], 10);
          } else {
            day = parseInt(parts[0], 10);
            month = parseInt(parts[1], 10);
            year = parseInt(parts[2], 10);
          }
        }

        if (isNaN(day) || isNaN(month) || isNaN(year)) return '';

        if (year < 100) {
          year = 2000 + (year - 43);
        } else if (year > 2400) {
          year -= 543;
        }

        const dd = String(day).padStart(2, '0');
        const mm = String(month).padStart(2, '0');

        const timeParts = timePart.split(':');
        const hh = (timeParts[0] || '00').padStart(2, '0');
        const min = (timeParts[1] || '00').padStart(2, '0');

        return `${year}-${mm}-${dd}T${hh}:${min}`;
      } catch (e) {
        return '';
      }
    }

    function formatInputToDate(inputVal) {
      if (!inputVal) return '';
      const [datePart, timePart] = inputVal.split('T');
      if (!datePart) return '';
      
      const [y, m, d] = datePart.split('-');
      const yearTH = parseInt(y, 10) + 543;
      return `${d}/${m}/${yearTH} ${timePart || '00:00'}`;
    }

    function openEditModal(item) {
      document.getElementById("editRowIndex").value = item.rowIndex;
      document.getElementById("editCategory").value = item.category;
      document.getElementById("editAmount").value = item.amount;
      document.getElementById("editDate").value = parseDateToInput(item.date);

      setType(item.type);
      document.getElementById("editModal").classList.remove("hidden");
    }

    function closeModal() {
      document.getElementById("editModal").classList.add("hidden");
    }

    function setType(type) {
      currentType = type;
      const btnExpense = document.getElementById("btnTypeExpense");
      const btnIncome = document.getElementById("btnTypeIncome");

      if (type === "รายจ่าย") {
        btnExpense.className = "py-2.5 rounded-xl font-medium border text-center border-pink-500 bg-pink-50 text-pink-600";
        btnIncome.className = "py-2.5 rounded-xl font-medium border text-center border-gray-200 text-gray-600";
      } else {
        btnIncome.className = "py-2.5 rounded-xl font-medium border text-center border-sky-500 bg-sky-50 text-sky-600";
        btnExpense.className = "py-2.5 rounded-xl font-medium border text-center border-gray-200 text-gray-600";
      }
    }

    async function saveItem() {
      const rowIndex = document.getElementById("editRowIndex").value;
      const category = document.getElementById("editCategory").value;
      const amount = parseFloat(document.getElementById("editAmount").value) || 0;
      
      const rawDateInput = document.getElementById("editDate").value;
      const formattedDate = formatInputToDate(rawDateInput);

      closeModal();
      document.getElementById("itemList").innerHTML = '<p class="text-center text-xs text-gray-400 py-4">กำลังบันทึกข้อมูล...</p>';

      await fetch(WORKER_URL, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ rowIndex, type: currentType, category, amount, date: formattedDate, note: "" })
      });

      fetchData();
    }

    async function deleteItem() {
      if (!confirm("ต้องการลบรายการนี้ใช่ไหม?")) return;

      const rowIndex = document.getElementById("editRowIndex").value;
      closeModal();
      document.getElementById("itemList").innerHTML = '<p class="text-center text-xs text-gray-400 py-4">กำลังลบรายการ...</p>';

      await fetch(WORKER_URL, {
        method: "DELETE",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ rowIndex })
      });

      fetchData();
    }

    main();
  </script>
</body>
</html>
