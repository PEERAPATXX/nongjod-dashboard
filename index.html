<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สรุปยอด - น้องจด</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Prompt', sans-serif; background-color: #FAF6ED; }
  </style>
</head>
<body class="p-4 text-gray-800 max-w-md mx-auto min-h-screen flex flex-col justify-between">

  <div>
    <!-- Header Profile -->
    <div class="flex items-center space-x-3 bg-white p-4 rounded-2xl shadow-sm mb-4 border border-rose-100">
      <img id="userPicture" class="w-12 h-12 rounded-full border-2 border-rose-400 bg-rose-50 object-cover" src="https://via.placeholder.com/150" alt="Profile" crossorigin="anonymous">
      <div>
        <h2 id="userName" class="font-bold text-lg leading-tight text-gray-800">กำลังโหลด...</h2>
        <span class="text-xs text-rose-500 bg-rose-50 px-2.5 py-0.5 rounded-full font-medium">หลานน้องจด 🧙‍♀️</span>
      </div>
    </div>

    <!-- สรุปยอด -->
    <div class="bg-white p-5 rounded-2xl shadow-sm mb-4 border border-rose-100">
      <div class="flex justify-between items-center mb-4">
        <h3 class="font-bold text-lg text-gray-800">📊 สรุปยอดทั้งหมด</h3>
        <span class="text-xs text-gray-400" id="currentDate"></span>
      </div>

      <div class="bg-gradient-to-r from-rose-500 to-pink-500 p-5 rounded-2xl mb-4 text-center text-white shadow-md">
        <p class="text-xs opacity-90 mb-1 font-light">คงเหลือสุทธิ</p>
        <h1 id="netTotal" class="text-3xl font-extrabold tracking-tight">฿0.00</h1>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div class="bg-emerald-50 p-3.5 rounded-xl border border-emerald-100 text-center">
          <p class="text-xs text-emerald-600 mb-1 font-medium">💰 รายรับรวม</p>
          <p id="totalIncome" class="text-lg font-bold text-emerald-600">฿0.00</p>
        </div>
        <div class="bg-rose-50 p-3.5 rounded-xl border border-rose-100 text-center">
          <p class="text-xs text-rose-500 mb-1 font-medium">💸 รายจ่ายรวม</p>
          <p id="totalExpense" class="text-lg font-bold text-rose-600">฿0.00</p>
        </div>
      </div>
    </div>

    <!-- รายการล่าสุด (ประวัติย้อนหลัง) -->
    <div class="bg-white p-5 rounded-2xl shadow-sm mb-4 border border-rose-100">
      <div class="flex justify-between items-center mb-3">
        <h3 class="font-bold text-md text-gray-800">📝 รายการล่าสุด</h3>
        <span class="text-xs text-gray-400">กดเพื่อแก้ไข/ลบ</span>
      </div>

      <div id="itemList" class="space-y-2.5 max-h-80 overflow-y-auto pr-1">
        <p class="text-center text-xs text-gray-400 py-4">กำลังโหลดรายการ...</p>
      </div>
    </div>
  </div>

  <!-- ปุ่มปิดหน้าต่าง -->
  <div class="mt-2 mb-4">
    <button onclick="handleClose()" class="w-full py-3.5 bg-rose-500 hover:bg-rose-600 text-white font-semibold rounded-xl text-sm shadow-md transition active:scale-95">
      ปิดหน้าต่าง
    </button>
  </div>

  <!-- Modal แก้ไขรายการ -->
  <div id="editModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4 hidden z-50">
    <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl p-6 shadow-2xl animate-fade-in">
      <div class="flex justify-between items-center mb-4 border-b pb-3">
        <h3 class="font-bold text-lg text-gray-800">✏️ แก้ไขรายการ</h3>
        <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 font-bold text-xl">&times;</button>
      </div>

      <input type="hidden" id="editRowIndex">

      <div class="space-y-4 text-sm">
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">ประเภทรายการ</label>
          <div class="grid grid-cols-2 gap-2">
            <button type="button" id="btnTypeExpense" onclick="setType('รายจ่าย')" class="py-2 rounded-xl font-medium border text-center border-rose-500 bg-rose-50 text-rose-600">รายจ่าย</button>
            <button type="button" id="btnTypeIncome" onclick="setType('รายรับ')" class="py-2 rounded-xl font-medium border text-center border-gray-200 text-gray-600">รายรับ</button>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">หมวดหมู่ / รายละเอียด</label>
          <input type="text" id="editCategory" class="w-full p-3 border border-gray-200 rounded-xl focus:outline-none focus:border-rose-400">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">จำนวนเงิน (บาท)</label>
          <input type="number" step="any" id="editAmount" class="w-full p-3 border border-gray-200 rounded-xl focus:outline-none focus:border-rose-400 font-bold text-lg text-rose-600">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">วันที่และเวลา</label>
          <input type="text" id="editDate" class="w-full p-3 border border-gray-100 bg-gray-50 rounded-xl text-gray-500" readonly>
        </div>
      </div>

      <div class="flex space-x-2 mt-6">
        <button onclick="deleteItem()" class="flex-1 py-3 bg-gray-100 hover:bg-red-50 text-red-500 font-semibold rounded-xl transition">🗑️ ลบ</button>
        <button onclick="saveItem()" class="flex-[2] py-3 bg-emerald-500 hover:bg-emerald-600 text-white font-semibold rounded-xl shadow-md transition">บันทึก</button>
      </div>
    </div>
  </div>

  <script>
    const WORKER_URL = "https://nongjod.hay-peerapattx-co-th.workers.dev/";
    let currentType = "รายจ่าย";

    async function main() {
      const options = { year: 'numeric', month: 'short', day: 'numeric' };
      document.getElementById("currentDate").innerText = new Date().toLocaleDateString('th-TH', options);

      try {
        await liff.init({ liffId: "2009228308-x4y4D63m" });
        if (liff.isLoggedIn()) {
          const profile = await liff.getProfile();
          document.getElementById("userName").innerText = profile.displayName;
          if (profile.pictureUrl) {
            document.getElementById("userPicture").src = profile.pictureUrl;
          }
        } else {
          document.getElementById("userName").innerText = "ผู้ใช้งานน้องจด";
        }
      } catch (err) {
        console.log("LIFF Init Error:", err);
        document.getElementById("userName").innerText = "ผู้ใช้งานน้องจด";
      }

      fetchData();
    }

    async function fetchData() {
      try {
        const res = await fetch(WORKER_URL);
        const data = await res.json();

        document.getElementById("totalIncome").innerText = `฿${data.totalIncome.toLocaleString()}`;
        document.getElementById("totalExpense").innerText = `฿${data.totalExpense.toLocaleString()}`;
        document.getElementById("netTotal").innerText = `฿${data.netTotal.toLocaleString()}`;

        renderItemList(data.items);
      } catch (e) {
        console.error("Fetch Data Error:", e);
      }
    }

    function renderItemList(items) {
      const listEl = document.getElementById("itemList");
      if (!items || items.length === 0) {
        listEl.innerHTML = '<p class="text-center text-xs text-gray-400 py-4">ยังไม่มีรายการบันทึก</p>';
        return;
      }

      listEl.innerHTML = items.map(item => {
        const isIncome = item.type === "รายรับ";
        const colorClass = isIncome ? "text-emerald-600 bg-emerald-50" : "text-rose-600 bg-rose-50";
        const amountSign = isIncome ? "+" : "-";

        return `
          <div onclick='openEditModal(${JSON.stringify(item)})' class="flex justify-between items-center p-3 rounded-xl border border-gray-100 hover:border-rose-200 cursor-pointer active:scale-98 transition">
            <div>
              <p class="font-semibold text-sm text-gray-800">${item.category}</p>
              <p class="text-[10px] text-gray-400">${item.date}</p>
            </div>
            <div class="text-right">
              <span class="text-sm font-bold ${colorClass} px-2.5 py-1 rounded-lg">
                ${amountSign}฿${item.amount.toLocaleString()}
              </span>
            </div>
          </div>
        `;
      }).join('');
    }

    function openEditModal(item) {
      document.getElementById("editRowIndex").value = item.rowIndex;
      document.getElementById("editCategory").value = item.category;
      document.getElementById("editAmount").value = item.amount;
      document.getElementById("editDate").value = item.date;
      setType(item.type);

      document.getElementById("editModal").classList.remove("hidden");
    }

    function closeModal() {
      document.getElementById("editModal").classList.add("hidden");
    }

    function setType(type) {
      currentType = type;
      const btnExpense = document.getElementById("btnTypeExpense");
      const btnIncome = document.getElementById("btnTypeIncome");

      if (type === "รายจ่าย") {
        btnExpense.className = "py-2 rounded-xl font-medium border text-center border-rose-500 bg-rose-50 text-rose-600";
        btnIncome.className = "py-2 rounded-xl font-medium border text-center border-gray-200 text-gray-600";
      } else {
        btnIncome.className = "py-2 rounded-xl font-medium border text-center border-emerald-500 bg-emerald-50 text-emerald-600";
        btnExpense.className = "py-2 rounded-xl font-medium border text-center border-gray-200 text-gray-600";
      }
    }

    async function saveItem() {
      const rowIndex = document.getElementById("editRowIndex").value;
      const category = document.getElementById("editCategory").value;
      const amount = parseFloat(document.getElementById("editAmount").value) || 0;
      const date = document.getElementById("editDate").value;

      closeModal();
      document.getElementById("itemList").innerHTML = '<p class="text-center text-xs text-gray-400 py-4">กำลังบันทึกข้อมูล...</p>';

      await fetch(WORKER_URL, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ rowIndex, type: currentType, category, amount, date, note: "" })
      });

      fetchData();
    }

    async function deleteItem() {
      if (!confirm("ต้องการลบรายการนี้ใช่ไหม?")) return;

      const rowIndex = document.getElementById("editRowIndex").value;
      closeModal();
      document.getElementById("itemList").innerHTML = '<p class="text-center text-xs text-gray-400 py-4">กำลังลบรายการ...</p>';

      await fetch(WORKER_URL, {
        method: "DELETE",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ rowIndex })
      });

      fetchData();
    }

    function handleClose() {
      if (typeof liff !== "undefined" && liff.isInClient()) {
        liff.closeWindow();
      } else {
        window.close();
      }
    }

    main();
  </script>
</body>
</html>
