<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>สรุปยอดรายรับ-รายจ่าย</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Flatpickr (Calendar Picker) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://npmcdn.com/flatpickr/dist/l10n/th.js"></script>
  <!-- LINE LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap');
    body {
      font-family: 'Kanit', sans-serif;
      background-color: #f3f4f6;
    }
    .modal-open {
      overflow: hidden !important;
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen pb-10 text-gray-800">

  <!-- Header -->
  <header class="bg-indigo-600 text-white p-4 shadow-md sticky top-0 z-30">
    <div class="max-w-xl mx-auto flex justify-between items-center">
      <h1 class="text-lg font-semibold flex items-center gap-2">
        <i class="fa-solid me-1 fa-chart-pie"></i> สรุปรายรับ-รายจ่าย
      </h1>
      <!-- Month Selector -->
      <select id="monthSelect" onchange="onMonthChange()" class="bg-indigo-700 text-white text-sm rounded-lg px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-white border border-indigo-500">
        <!-- JS Options populated here -->
      </select>
    </div>
  </header>

  <main class="max-w-xl mx-auto p-4 space-y-4">

    <!-- Card Overview -->
    <div class="grid grid-cols-3 gap-3">
      <div class="bg-white p-3 rounded-2xl shadow-sm border border-gray-100 text-center">
        <p class="text-xs text-gray-500 mb-1">รายรับ</p>
        <p id="totalIncome" class="text-base font-semibold text-emerald-600">฿0</p>
      </div>
      <div class="bg-white p-3 rounded-2xl shadow-sm border border-gray-100 text-center">
        <p class="text-xs text-gray-500 mb-1">รายจ่าย</p>
        <p id="totalExpense" class="text-base font-semibold text-rose-600">฿0</p>
      </div>
      <div class="bg-white p-3 rounded-2xl shadow-sm border border-gray-100 text-center">
        <p class="text-xs text-gray-500 mb-1">คงเหลือ</p>
        <p id="totalBalance" class="text-base font-semibold text-indigo-600">฿0</p>
      </div>
    </div>

    <!-- Chart Section -->
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
      <h2 class="text-sm font-semibold text-gray-700 mb-3 flex items-center justify-between">
        <span>สัดส่วนรายจ่ายแยกตามหมวดหมู่</span>
        <span id="chartTotal" class="text-xs text-gray-400 font-normal"></span>
      </h2>
      <div class="relative w-full h-52 flex justify-center items-center">
        <canvas id="expenseChart"></canvas>
      </div>
    </div>

    <!-- Filter & Search Section -->
    <div class="bg-white p-3 rounded-2xl shadow-sm border border-gray-100 flex flex-col sm:flex-row gap-2 items-center justify-between">
      <div class="relative w-full">
        <i class="fa-solid fa-calendar-days absolute left-3 top-2.5 text-gray-400 text-sm"></i>
        <input type="text" id="dateFilter" placeholder="กรองตามช่วงวันที่..." class="w-full pl-9 pr-3 py-1.5 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-1 focus:ring-indigo-500">
      </div>
      <button onclick="clearDateFilter()" class="w-full sm:w-auto px-3 py-1.5 text-xs text-gray-600 bg-gray-100 hover:bg-gray-200 rounded-lg transition shrink-0">
        ล้างตัวกรอง
      </button>
    </div>

    <!-- Transaction List Section -->
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
      <div class="p-3 bg-gray-50 border-b border-gray-100 flex justify-between items-center">
        <h3 class="text-sm font-semibold text-gray-700">รายการทั้งหมด</h3>
        <span id="itemCount" class="text-xs text-gray-400">0 รายการ</span>
      </div>
      
      <!-- List Items -->
      <div id="itemList" class="divide-y divide-gray-100 max-h-[400px] overflow-y-auto">
        <div class="p-8 text-center text-gray-400 text-sm">
          <i class="fa-solid fa-spinner fa-spin text-xl mb-2 text-indigo-500"></i>
          <p>กำลังโหลดข้อมูล...</p>
        </div>
      </div>
    </div>

  </main>

  <!-- Edit Modal -->
  <div id="editModal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 hidden backdrop-blur-sm">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden transform transition-all">
      <div class="p-4 bg-indigo-600 text-white flex justify-between items-center">
        <h3 class="font-semibold text-base"><i class="fa-solid fa-pen-to-square me-1"></i> แก้ไขรายการ</h3>
        <button onclick="closeModal()" class="text-white/80 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      
      <form id="editForm" onsubmit="handleSave(event)" class="p-4 space-y-3">
        <input type="hidden" id="editRowIndex">
        <input type="hidden" id="editOriginalDate">

        <div>
          <label class="block text-xs text-gray-500 mb-1">ประเภท</label>
          <select id="editType" class="w-full p-2 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:ring-1 focus:ring-indigo-500" required>
            <option value="รายจ่าย">รายจ่าย</option>
            <option value="รายรับ">รายรับ</option>
          </select>
        </div>

        <div>
          <label class="block text-xs text-gray-500 mb-1">หมวดหมู่</label>
          <input type="text" id="editCategory" class="w-full p-2 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:ring-1 focus:ring-indigo-500" required>
        </div>

        <div>
          <label class="block text-xs text-gray-500 mb-1">จำนวนเงิน (บาท)</label>
          <input type="number" step="any" id="editAmount" class="w-full p-2 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:ring-1 focus:ring-indigo-500" required>
        </div>

        <div>
          <label class="block text-xs text-gray-500 mb-1">บันทึกเพิ่มเติม</label>
          <input type="text" id="editNote" class="w-full p-2 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:ring-1 focus:ring-indigo-500">
        </div>

        <div>
          <label class="block text-xs text-gray-500 mb-1">วัน-เวลา (ระบุหากต้องการเปลี่ยน)</label>
          <input type="text" id="editDate" placeholder="คงเดิมไว้ถ้าระบุไม่ได้" class="w-full p-2 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:ring-1 focus:ring-indigo-500">
        </div>

        <div class="flex gap-2 pt-2">
          <button type="button" onclick="closeModal()" class="w-1/2 py-2 text-sm font-medium text-gray-600 bg-gray-100 rounded-lg hover:bg-gray-200">ยกเลิก</button>
          <button type="submit" id="saveBtn" class="w-1/2 py-2 text-sm font-medium text-white bg-indigo-600 rounded-lg hover:bg-indigo-700">บันทึก</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // ** กำหนดค่า WORKER_URL ตรงนี้ **
    const WORKER_URL = "YOUR_WORKER_URL_HERE"; // แทนที่ด้วย Cloudflare Worker URL ของคุณ
    
    let rawItems = [];
    let filteredItems = [];
    let chartInstance = null;
    let flatpickrFilter = null;
    let flatpickrEdit = null;

    document.addEventListener("DOMContentLoaded", () => {
      initMonthOptions();
      initFlatpickr();
      fetchData();
    });

    function initMonthOptions() {
      const select = document.getElementById("monthSelect");
      select.innerHTML = "";
      const now = new Date();

      for (let i = 0; i < 12; i++) {
        const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        const yyyy = d.getFullYear();
        const sheetName = `CleanName_${mm}-${yyyy}`;
        
        const monthNamesTH = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
        const label = `${monthNamesTH[d.getMonth()]} ${yyyy + 543}`;

        const opt = document.createElement("option");
        opt.value = sheetName;
        opt.textContent = label;
        select.appendChild(opt);
      }
    }

    function initFlatpickr() {
      flatpickrFilter = flatpickr("#dateFilter", {
        mode: "range",
        dateFormat: "Y-m-d",
        locale: "th",
        onChange: (selectedDates) => {
          if (selectedDates.length === 2 || selectedDates.length === 1) {
            applyDateFilter(selectedDates);
          }
        }
      });

      flatpickrEdit = flatpickr("#editDate", {
        enableTime: true,
        dateFormat: "Y-m-d H:i:S",
        time_24hr: true,
        locale: "th"
      });
    }

    async function fetchData() {
      const sheetName = document.getElementById("monthSelect").value;
      const itemList = document.getElementById("itemList");
      
      itemList.innerHTML = `
        <div class="p-8 text-center text-gray-400 text-sm">
          <i class="fa-solid fa-spinner fa-spin text-xl mb-2 text-indigo-500"></i>
          <p>กำลังโหลดข้อมูล...</p>
        </div>`;

      try {
        const res = await fetch(`${WORKER_URL}?sheet=${encodeURIComponent(sheetName)}`);
        const data = await res.json();
        
        rawItems = data.items || [];
        filteredItems = [...rawItems];
        
        if (flatpickrFilter) flatpickrFilter.clear();
        renderAll();
      } catch (err) {
        console.error("Fetch Error:", err);
        itemList.innerHTML = `
          <div class="p-8 text-center text-rose-500 text-sm">
            <i class="fa-solid fa-triangle-exclamation text-xl mb-2"></i>
            <p>ไม่สามารถโหลดข้อมูลได้</p>
          </div>`;
      }
    }

    function onMonthChange() {
      fetchData();
    }

    function renderAll() {
      renderSummary();
      renderChart();
      renderList();
    }

    function renderSummary() {
      let income = 0;
      let expense = 0;

      filteredItems.forEach(item => {
        const amt = parseFloat(item.amount) || 0;
        if (item.type === "รายรับ") income += amt;
        else if (item.type === "รายจ่าย") expense += amt;
      });

      document.getElementById("totalIncome").textContent = `฿${income.toLocaleString()}`;
      document.getElementById("totalExpense").textContent = `฿${expense.toLocaleString()}`;
      document.getElementById("totalBalance").textContent = `฿${(income - expense).toLocaleString()}`;
    }

    function renderChart() {
      const catMap = {};
      let totalExp = 0;

      filteredItems.forEach(item => {
        if (item.type === "รายจ่าย") {
          const amt = parseFloat(item.amount) || 0;
          catMap[item.category] = (catMap[item.category] || 0) + amt;
          totalExp += amt;
        }
      });

      document.getElementById("chartTotal").textContent = `รวม ฿${totalExp.toLocaleString()}`;

      const labels = Object.keys(catMap);
      const values = Object.values(catMap);

      if (chartInstance) chartInstance.destroy();

      const ctx = document.getElementById("expenseChart").getContext("2d");
      
      if (labels.length === 0) {
        chartInstance = new Chart(ctx, {
          type: 'doughnut',
          data: {
            labels: ['ไม่มีรายการ'],
            datasets: [{ data: [1], backgroundColor: ['#e5e7eb'] }]
          },
          options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
        });
        return;
      }

      const colors = ['#6366f1', '#ec4899', '#f59e0b', '#10b981', '#3b82f6', '#8b5cf6', '#14b8a6', '#f43f5e'];

      chartInstance = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: labels,
          datasets: [{
            data: values,
            backgroundColor: colors.slice(0, labels.length)
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { position: 'right', labels: { boxWidth: 12, font: { family: 'Kanit', size: 11 } } }
          }
        }
      });
    }

    function renderList() {
      const itemList = document.getElementById("itemList");
      document.getElementById("itemCount").textContent = `${filteredItems.length} รายการ`;

      if (filteredItems.length === 0) {
        itemList.innerHTML = `<div class="p-8 text-center text-gray-400 text-sm">ไม่พบรายการข้อมูล</div>`;
        return;
      }

      itemList.innerHTML = filteredItems.map(item => {
        const isIncome = item.type === "รายรับ";
        const amtClass = isIncome ? "text-emerald-600" : "text-rose-600";
        const sign = isIncome ? "+" : "-";
        
        return `
          <div class="p-3 flex items-center justify-between hover:bg-gray-50 transition">
            <div class="flex items-center gap-3">
              <div class="w-8 h-8 rounded-full ${isIncome ? 'bg-emerald-100 text-emerald-600' : 'bg-rose-100 text-rose-600'} flex items-center justify-center text-xs">
                <i class="fa-solid ${isIncome ? 'fa-arrow-down' : 'fa-arrow-up'}"></i>
              </div>
              <div>
                <p class="text-sm font-medium text-gray-800">${escapeHtml(item.category)}</p>
                <p class="text-xs text-gray-400">${escapeHtml(item.date || '')} ${item.note ? '• ' + escapeHtml(item.note) : ''}</p>
              </div>
            </div>
            <div class="flex items-center gap-3">
              <span class="text-sm font-semibold ${amtClass}">${sign}฿${(parseFloat(item.amount) || 0).toLocaleString()}</span>
              <button onclick="openEditModal(${item.rowIndex})" class="text-gray-400 hover:text-indigo-600 p-1"><i class="fa-solid fa-pen text-xs"></i></button>
              <button onclick="deleteItem(${item.rowIndex})" class="text-gray-400 hover:text-rose-600 p-1"><i class="fa-solid fa-trash text-xs"></i></button>
            </div>
          </div>
        `;
      }).join('');
    }

    function applyDateFilter(dates) {
      if (dates.length === 0) {
        filteredItems = [...rawItems];
      } else {
        const start = dates[0].setHours(0, 0, 0, 0);
        const end = dates[1] ? dates[1].setHours(23, 59, 59, 999) : dates[0].setHours(23, 59, 59, 999);

        filteredItems = rawItems.filter(item => {
          if (!item.date) return false;
          const itemTime = new Date(item.date).getTime();
          return itemTime >= start && itemTime <= end;
        });
      }
      renderAll();
    }

    function clearDateFilter() {
      if (flatpickrFilter) flatpickrFilter.clear();
      filteredItems = [...rawItems];
      renderAll();
    }

    function openEditModal(rowIndex) {
      const item = rawItems.find(i => i.rowIndex === rowIndex);
      if (!item) return;

      document.getElementById("editRowIndex").value = item.rowIndex;
      document.getElementById("editType").value = item.type;
      document.getElementById("editCategory").value = item.category;
      document.getElementById("editAmount").value = item.amount;
      document.getElementById("editNote").value = item.note || '';
      document.getElementById("editOriginalDate").value = item.date || '';
      
      if (flatpickrEdit) flatpickrEdit.setDate(item.date || '');

      document.body.classList.add("modal-open");
      document.getElementById("editModal").classList.remove("hidden");
    }

    function closeModal() {
      document.body.classList.remove("modal-open");
      document.getElementById("editModal").classList.add("hidden");
    }

    async function handleSave(e) {
      e.preventDefault();
      const saveBtn = document.getElementById("saveBtn");
      saveBtn.disabled = true;
      saveBtn.textContent = "กำลังบันทึก...";

      const rowIndex = parseInt(document.getElementById("editRowIndex").value);
      const rawDate = document.getElementById("editDate").value;
      const originalDate = document.getElementById("editOriginalDate").value;
      const sheetName = document.getElementById("monthSelect").value;

      const updatedData = {
        rowIndex,
        type: document.getElementById("editType").value,
        category: document.getElementById("editCategory").value,
        amount: parseFloat(document.getElementById("editAmount").value),
        note: document.getElementById("editNote").value,
        date: rawDate.trim() !== "" ? rawDate : originalDate,
        sheetName
      };

      try {
        const res = await fetch(WORKER_URL, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(updatedData)
        });

        if (!res.ok) throw new Error("Update failed");

        closeModal();
        await fetchData();
      } catch (err) {
        alert("เกิดข้อผิดพลาดในการบันทึกข้อมูล");
        console.error(err);
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = "บันทึก";
      }
    }

    async function deleteItem(rowIndex) {
      if (!confirm("คุณต้องการลบรายการนี้ใช่หรือไม่?")) return;

      const sheetName = document.getElementById("monthSelect").value;

      try {
        const res = await fetch(WORKER_URL, {
          method: "DELETE",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ rowIndex, sheetName })
        });

        if (!res.ok) throw new Error("Delete failed");

        await fetchData();
      } catch (err) {
        alert("เกิดข้อผิดพลาดในการลบรายการ");
        console.error(err);
      }
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
