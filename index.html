<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สรุปยอด - น้องจด</title>
  <!-- LINE LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Prompt', sans-serif; background-color: #FFF5F7; }
  </style>
</head>
<body class="p-4 text-gray-800 max-w-md mx-auto min-h-screen flex flex-col justify-between">

  <div>
    <!-- Header Profile -->
    <div class="flex items-center space-x-3 bg-white p-4 rounded-2xl shadow-sm mb-4 border border-pink-100">
      <img id="userPicture" class="w-12 h-12 rounded-full border-2 border-pink-400 bg-pink-50 object-cover" src="https://via.placeholder.com/150" alt="Profile">
      <div>
        <h2 id="userName" class="font-bold text-lg leading-tight text-gray-800">กำลังโหลด...</h2>
        <span class="text-xs text-pink-500 bg-pink-50 px-2.5 py-0.5 rounded-full font-medium">หลานน้องจด 🧙‍♀️</span>
      </div>
    </div>

    <!-- Dashboard สรุปยอด -->
    <div class="bg-white p-5 rounded-2xl shadow-sm mb-4 border border-pink-100">
      <div class="flex justify-between items-center mb-4">
        <h3 class="font-bold text-lg text-gray-800">📊 สรุปยอดทั้งหมด</h3>
        <span class="text-xs text-gray-400" id="currentDate"></span>
      </div>

      <!-- ยอดคงเหลือสุทธิ -->
      <div class="bg-gradient-to-r from-pink-500 to-rose-400 p-5 rounded-2xl mb-4 text-center text-white shadow-md">
        <p class="text-xs opacity-90 mb-1 font-light">คงเหลือสุทธิ</p>
        <h1 id="netTotal" class="text-3xl font-extrabold tracking-tight">฿0.00</h1>
      </div>

      <!-- การ์ดแยก รายรับ / รายจ่าย -->
      <div class="grid grid-cols-2 gap-3">
        <div class="bg-emerald-50 p-3.5 rounded-xl border border-emerald-100 text-center">
          <p class="text-xs text-emerald-600 mb-1 font-medium">💰 รายรับรวม</p>
          <p id="totalIncome" class="text-lg font-bold text-emerald-600">฿0.00</p>
        </div>
        <div class="bg-rose-50 p-3.5 rounded-xl border border-rose-100 text-center">
          <p class="text-xs text-rose-500 mb-1 font-medium">💸 รายจ่ายรวม</p>
          <p id="totalExpense" class="text-lg font-bold text-rose-600">฿0.00</p>
        </div>
      </div>
    </div>
  </div>

  <!-- ปุ่มปิดหน้าต่าง -->
  <div class="mt-4">
    <button onclick="liff.closeWindow()" class="w-full py-3.5 bg-pink-500 hover:bg-pink-600 text-white font-semibold rounded-xl text-sm shadow-md transition active:scale-95">
      ปิดหน้าต่าง
    </button>
  </div>

  <script>
    // 🔗 URL ของ Cloudflare Worker มึง
    const WORKER_URL = "https://nongjod.hay-peerapattx-co-th.workers.dev/";

    async function main() {
      // โชว์วันที่ปัจจุบัน
      const options = { year: 'numeric', month: 'short', day: 'numeric' };
      document.getElementById("currentDate").innerText = new Date().toLocaleDateString('th-TH', options);

      // เริ่มต้นระบบ LIFF
      try {
        await liff.init({ liffId: "2009228308-x4y4D63m" }); // ใส่ LIFF ID ได้ถ้ามี ถ้าไม่มีมันจะข้ามไปดึงข้อมูลเลย
        if (liff.isLoggedIn()) {
          const profile = await liff.getProfile();
          document.getElementById("userName").innerText = profile.displayName;
          if (profile.pictureUrl) {
            document.getElementById("userPicture").src = profile.pictureUrl;
          }
        } else {
          document.getElementById("userName").innerText = "ผู้ใช้งานน้องจด";
        }
      } catch (err) {
        console.log("LIFF Init / Local Mode", err);
        document.getElementById("userName").innerText = "ผู้ใช้งานน้องจด";
      }

      // ดึงข้อมูลยอดสรุปจาก Cloudflare Worker
      fetchSummaryData();
    }

    async function fetchSummaryData() {
      try {
        const res = await fetch(WORKER_URL);
        const data = await res.json();

        // ใส่ตัวเลขยอดเงินพร้อมใส่คอมม่า (,)
        document.getElementById("totalIncome").innerText = `฿${data.totalIncome.toLocaleString()}`;
        document.getElementById("totalExpense").innerText = `฿${data.totalExpense.toLocaleString()}`;
        
        const netTotalEl = document.getElementById("netTotal");
        netTotalEl.innerText = `฿${data.netTotal.toLocaleString()}`;

      } catch (e) {
        console.error("ดึงข้อมูลสรุปยอดไม่สำเร็จ:", e);
      }
    }

    main();
  </script>
</body>
</html>
