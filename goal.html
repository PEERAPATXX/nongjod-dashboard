<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  
  <title>เป้าหมาย - น้องจด</title>
  
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Prompt', sans-serif; background-color: #F8F9FA; }
    .nav-active { color: #E6007E; font-weight: 600; }
    
    input[type="month"]::-webkit-calendar-picker-indicator,
    input[type="date"]::-webkit-calendar-picker-indicator {
      cursor: pointer;
      opacity: 0.6;
    }

    /* Style สำหรับ Card ตอนกำลังลาก */
    .dragging {
      opacity: 0.4;
      transform: scale(0.98);
    }
    .drag-over {
      border-2 border-dashed border-[#E6007E] !important;
    }
  </style>
</head>
<body class="max-w-md mx-auto min-h-screen text-gray-800 pb-28">

  <div class="p-4 space-y-4">
    
    <!-- Section สรุปภาพรวมทางการเงิน (ปรับธีมสีชมพูล้วนสดใส) -->
    <div class="bg-white p-5 rounded-3xl shadow-sm border border-gray-100 space-y-4">
      <div class="flex justify-between items-center">
        <div>
          <h1 class="font-bold text-lg text-gray-900">เป้าหมายประจำเดือน</h1>
          <p class="text-xs text-gray-400">วางแผนและติดตามค่างวด</p>
        </div>
        <div class="relative flex items-center bg-pink-50 border border-pink-100 rounded-xl px-2.5 py-1 text-xs font-medium text-[#E6007E]">
          <span class="mr-1">📅</span>
          <input type="month" id="monthPicker" onchange="onMonthChange(this.value)" class="bg-transparent focus:outline-none cursor-pointer text-xs text-[#E6007E] font-semibold">
        </div>
      </div>

      <!-- สรุปตัวเลขเงินคงเหลือจริง (สีชมพูล้วน #E6007E ไม่มีสีดำผสม) -->
      <div class="p-5 rounded-2xl bg-gradient-to-br from-[#FF3B9A] via-[#E6007E] to-[#C4006B] text-white space-y-3 shadow-lg shadow-pink-200">
        <div class="flex justify-between items-center text-xs text-pink-100">
          <span>เงินในระบบคงเหลือทั้งหมด</span>
          <span id="netBalanceText" class="font-semibold text-white">฿0</span>
        </div>
        <div class="pt-2 border-t border-pink-300/40 flex justify-between items-end">
          <div>
            <p class="text-[11px] text-pink-100">เงินคงเหลือจริง (หลังหักจ่ายค่างวดแล้ว)</p>
            <h2 id="remainingAfterPaidText" class="text-2xl font-bold text-white mt-0.5">฿0</h2>
          </div>
          <div class="text-right">
            <p class="text-[11px] text-pink-100">จ่ายไปแล้วรวม</p>
            <p id="paidTotalText" class="text-sm font-bold text-pink-100">฿0</p>
          </div>
        </div>
      </div>

      <!-- รายละเอียดเป้าหมายรวม -->
      <div class="grid grid-cols-2 gap-2 text-xs pt-1">
        <div class="p-2.5 rounded-xl bg-pink-50/50 border border-pink-100/60">
          <span class="text-gray-400">เป้าหมายรวมทั้งหมด:</span>
          <p id="totalTargetText" class="font-semibold text-gray-800 mt-0.5">฿0</p>
        </div>
        <div class="p-2.5 rounded-xl bg-pink-50/50 border border-pink-100/60">
          <span class="text-gray-400">ยังค้างจ่ายอีก:</span>
          <p id="pendingTotalText" class="font-semibold text-amber-600 mt-0.5">฿0</p>
        </div>
      </div>

      <!-- Total Progress Bar -->
      <div class="space-y-1.5 pt-1">
        <div class="flex justify-between text-xs font-medium">
          <span class="text-gray-500">ความคืบหน้าการจ่ายค่างวดรวม</span>
          <span id="totalPercentText" class="text-[#E6007E] font-semibold">0%</span>
        </div>
        <div class="w-full bg-pink-100/60 rounded-full h-2.5 overflow-hidden">
          <div id="totalProgressBar" class="bg-[#E6007E] h-full rounded-full transition-all duration-500" style="width: 0%"></div>
        </div>
      </div>
    </div>

    <!-- ปุ่มเปิด Modal ตั้งเป้าหมายใหม่ -->
    <button onclick="openModal()" class="w-full bg-white border border-pink-200 hover:border-[#E6007E] text-gray-700 hover:text-[#E6007E] font-medium py-3 px-4 rounded-2xl flex items-center justify-center gap-2 transition-all shadow-sm">
      <span class="text-lg font-bold text-[#E6007E]">+</span> ตั้งเป้าหมาย / ค่างวดใหม่
    </button>

    <!-- รายการเป้าหมายทั้งหมด -->
    <div class="space-y-3">
      <div class="flex justify-between items-center px-1">
        <h3 class="font-bold text-gray-900 text-sm">รายการเป้าหมาย & ค่างวด</h3>
        <span id="loadingStatus" class="text-xs text-gray-400">กำลังโหลด...</span>
      </div>
      
      <div id="goalList" class="space-y-3">
        <!-- รายการแสดงผลผ่าน JS -->
      </div>
    </div>

  </div>

  <!-- Modal สำหรับเพิ่มเป้าหมายใหม่ -->
  <div id="goalModal" class="fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4 hidden backdrop-blur-sm">
    <div class="bg-white rounded-3xl p-6 w-full max-w-sm space-y-4 shadow-lg border border-gray-100">
      <div class="flex justify-between items-center border-b border-gray-100 pb-3">
        <h3 class="font-bold text-base text-gray-900">เพิ่มเป้าหมายใหม่</h3>
        <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 text-xl font-bold">&times;</button>
      </div>

      <form id="goalForm" onsubmit="saveGoal(event)" class="space-y-3">
        <div>
          <label class="block text-xs font-medium text-gray-600 mb-1">ชื่อรายการ</label>
          <input type="text" id="goalTitle" required placeholder="เช่น ค่าเน็ตบ้าน, ค่างวดรถ" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-[#E6007E]">
        </div>

        <div>
          <label class="block text-xs font-medium text-gray-600 mb-1">ยอดเป้าหมาย (บาท)</label>
          <input type="number" id="goalTarget" required placeholder="เช่น 590" min="1" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-[#E6007E]">
        </div>

        <div>
          <label class="block text-xs font-medium text-gray-600 mb-1">วันกำหนดจ่าย / ครบกำหนด (ถ้ามี)</label>
          <input type="date" id="goalDueDate" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-[#E6007E]">
        </div>

        <div class="pt-2 flex gap-2">
          <button type="button" onclick="closeModal()" class="flex-1 py-2.5 bg-gray-100 text-gray-600 rounded-xl text-sm font-medium">ยกเลิก</button>
          <button type="submit" class="flex-1 py-2.5 bg-[#E6007E] text-white rounded-xl text-sm font-medium shadow-sm">บันทึก</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Bottom Navigation Bar -->
  <div class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t border-gray-100 px-6 py-2 flex justify-around items-center z-40 text-center text-[11px] text-gray-400">
    <a href="index.html" class="flex flex-col items-center space-y-1 hover:text-gray-600 flex-1">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 00-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
      <span>สรุป</span>
    </a>
    <a href="analysis.html" class="flex flex-col items-center space-y-1 hover:text-gray-600 flex-1">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
      <span>วิเคราะห์</span>
    </a>
    <a href="goal.html" class="flex flex-col items-center space-y-1 nav-active flex-1">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
      <span>เป้าหมาย</span>
    </a>
  </div>

  <script>
    const WORKER_URL = "https://nongjod.hay-peerapattx-co-th.workers.dev/";
    let selectedDate = new Date();
    const defaultGoals = [];
    let draggedIndex = null;

    function cleanDisplayName(name) {
      if (!name) return "User";
      let cleaned = name.normalize("NFKD");
      cleaned = cleaned.replace(/[^\u0E00-\u0E7F\w\s]/gi, "").trim();
      return cleaned || "User";
    }

    function parseAmount(val) {
      if (!val) return 0;
      const cleanVal = String(val).replace(/,/g, '');
      return parseFloat(cleanVal) || 0;
    }

    function formatDateTH(dateStr) {
      if (!dateStr) return '';
      const [yyyy, mm, dd] = dateStr.split('-');
      return `${parseInt(dd)}/${parseInt(mm)}`;
    }

    function getDueBadgeHtml(dueDateStr, isPaid) {
      if (!dueDateStr || isPaid) return '';
      
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      
      const [yyyy, mm, dd] = dueDateStr.split('-');
      const targetDate = new Date(parseInt(yyyy), parseInt(mm) - 1, parseInt(dd));
      
      const diffTime = targetDate - today;
      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

      if (diffDays < 0) {
        return `<span class="text-[10px] bg-rose-100 text-rose-600 font-semibold px-2 py-0.5 rounded-full">เลยกำหนด ${Math.abs(diffDays)} วัน</span>`;
      } else if (diffDays === 0) {
        return `<span class="text-[10px] bg-rose-500 text-white font-semibold px-2 py-0.5 rounded-full animate-pulse">ครบกำหนดวันนี้</span>`;
      } else if (diffDays <= 3) {
        return `<span class="text-[10px] bg-amber-100 text-amber-700 font-semibold px-2 py-0.5 rounded-full">อีก ${diffDays} วัน</span>`;
      } else {
        return `<span class="text-[10px] text-gray-400 bg-gray-100 px-2 py-0.5 rounded-full">ครบกำหนด ${formatDateTH(dueDateStr)}</span>`;
      }
    }

    function getMonthKey(date) {
      const mm = String(date.getMonth() + 1).padStart(2, '0');
      const yyyy = date.getFullYear();
      return `nongjod_goals_${mm}-${yyyy}`;
    }

    function getStoredGoals(date) {
      const key = getMonthKey(date);
      const saved = localStorage.getItem(key);
      return saved ? JSON.parse(saved) : defaultGoals;
    }

    function saveStoredGoals(date, goals) {
      const key = getMonthKey(date);
      localStorage.setItem(key, JSON.stringify(goals));
      calculateAndRender();
    }

    function onMonthChange(val) {
      if (val) {
        const [yyyy, mm] = val.split('-');
        selectedDate = new Date(parseInt(yyyy), parseInt(mm) - 1, 1);
        calculateAndRender();
      }
    }

    function openModal() {
      document.getElementById('goalModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('goalModal').classList.add('hidden');
      document.getElementById('goalForm').reset();
    }

    function saveGoal(e) {
      e.preventDefault();
      const title = document.getElementById('goalTitle').value.trim();
      const target = parseFloat(document.getElementById('goalTarget').value) || 0;
      const dueDate = document.getElementById('goalDueDate').value;

      if (!title || target <= 0) return;

      const goals = getStoredGoals(selectedDate);
      goals.push({ id: Date.now(), title, target, dueDate, isPaid: false });

      saveStoredGoals(selectedDate, goals);
      closeModal();
    }

    function togglePaidStatus(id, canPay) {
      const goals = getStoredGoals(selectedDate);
      const targetGoal = goals.find(g => g.id === id);
      if (targetGoal) {
        if (targetGoal.isPaid || canPay) {
          targetGoal.isPaid = !targetGoal.isPaid;
          saveStoredGoals(selectedDate, goals);
        }
      }
    }

    function deleteGoal(id) {
      if (confirm('คุณต้องการลบรายการนี้ใช่หรือไม่?')) {
        const goals = getStoredGoals(selectedDate).filter(g => g.id !== id);
        saveStoredGoals(selectedDate, goals);
      }
    }

    // --- ระบบ Drag & Drop ลากสลับลำดับ ---
    function handleDragStart(e, index) {
      draggedIndex = index;
      e.currentTarget.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    }

    function handleDragOver(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      const card = e.currentTarget;
      card.classList.add('drag-over');
    }

    function handleDragLeave(e) {
      e.currentTarget.classList.remove('drag-over');
    }

    function handleDrop(e, targetIndex) {
      e.preventDefault();
      e.currentTarget.classList.remove('drag-over');
      
      if (draggedIndex !== null && draggedIndex !== targetIndex) {
        const goals = getStoredGoals(selectedDate);
        const movedItem = goals.splice(draggedIndex, 1)[0];
        goals.splice(targetIndex, 0, movedItem);
        saveStoredGoals(selectedDate, goals);
      }
      draggedIndex = null;
    }

    function handleDragEnd(e) {
      e.currentTarget.classList.remove('dragging');
      document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
    }

    async function fetchNetBalanceByDate(date) {
      let cleanName = "User";

      try {
        await liff.init({ liffId: "2010951712-Th0lITIH" });
        if (liff.isLoggedIn()) {
          const profile = await liff.getProfile();
          cleanName = cleanDisplayName(profile.displayName);
        } else {
          cleanName = cleanDisplayName("Peerapat");
        }
      } catch (e) {
        cleanName = cleanDisplayName("Peerapat");
      }

      const mm = String(date.getMonth() + 1).padStart(2, '0');
      const yyyy = date.getFullYear();
      const targetSheet = `${cleanName}_${mm}-${yyyy}`;

      try {
        const res = await fetch(`${WORKER_URL}?sheet=${encodeURIComponent(targetSheet)}&_t=${Date.now()}`);
        if (!res.ok) return 0;
        const data = await res.json();
        const items = data.items || [];

        let totalInc = 0;
        let totalExp = 0;

        items.forEach(item => {
          let amt = parseAmount(item.amount);
          let type = String(item.type || '').trim().toLowerCase();

          if (type.includes("รายรับ") || type.includes("รับ") || type.includes("income")) {
            totalInc += amt;
          } else if (amt > 0) {
            totalExp += amt;
          }
        });

        return totalInc - totalExp;
      } catch (e) {
        return 0;
      }
    }

    async function calculateAndRender() {
      document.getElementById('loadingStatus').innerText = "กำลังคำนวณ...";
      
      const availableBalance = await fetchNetBalanceByDate(selectedDate);
      document.getElementById('loadingStatus').innerText = "อัปเดตแล้ว";

      const goals = getStoredGoals(selectedDate);
      const container = document.getElementById('goalList');
      container.innerHTML = '';

      let totalTarget = 0;
      let totalPaidAmount = 0;

      let remainingForGoals = availableBalance;

      goals.forEach(g => {
        totalTarget += g.target;
        if (g.isPaid) {
          totalPaidAmount += g.target;
          remainingForGoals -= g.target;
        }
      });

      if (goals.length === 0) {
        container.innerHTML = `
          <div class="text-center py-8 bg-white rounded-3xl border border-gray-100">
            <p class="text-2xl text-pink-300">🎯</p>
            <p class="text-xs text-gray-400 mt-2">ยังไม่มีรายการเป้าหมายในเดือนนี้</p>
          </div>
        `;
      }

      goals.forEach((goal, idx) => {
        const isPaid = !!goal.isPaid;
        let filledAmount = 0;

        if (isPaid) {
          filledAmount = goal.target;
        } else {
          if (remainingForGoals > 0) {
            if (remainingForGoals >= goal.target) {
              filledAmount = goal.target;
              remainingForGoals -= goal.target;
            } else {
              filledAmount = remainingForGoals;
              remainingForGoals = 0;
            }
          }
        }

        const percent = Math.min(100, Math.round((filledAmount / goal.target) * 100));
        const isFull = percent >= 100;

        const card = document.createElement('div');
        card.draggable = true;
        card.className = `bg-white p-4 rounded-3xl shadow-sm border ${isPaid ? 'border-emerald-200 bg-emerald-50/20' : 'border-gray-100'} space-y-3 transition-all cursor-grab active:cursor-grabbing`;
        
        // Event Listeners สำหรับ Drag & Drop
        card.ondragstart = (e) => handleDragStart(e, idx);
        card.ondragover = (e) => handleDragOver(e);
        card.ondragleave = (e) => handleDragLeave(e);
        card.ondrop = (e) => handleDrop(e, idx);
        card.ondragend = (e) => handleDragEnd(e);

        let buttonHtml = '';
        if (isPaid) {
          buttonHtml = `
            <button onclick="togglePaidStatus(${goal.id}, true)" class="px-3 py-1.5 rounded-xl text-xs font-semibold bg-emerald-500 text-white shadow-sm transition-all hover:bg-emerald-600">
              ✓ จ่ายแล้ว
            </button>
          `;
        } else if (isFull) {
          buttonHtml = `
            <button onclick="togglePaidStatus(${goal.id}, true)" class="px-3 py-1.5 rounded-xl text-xs font-semibold bg-emerald-500 text-white shadow-sm transition-all hover:bg-emerald-600 animate-pulse">
              ✓ จ่ายเลย
            </button>
          `;
        } else {
          buttonHtml = `
            <button disabled class="px-3 py-1.5 rounded-xl text-xs font-medium bg-gray-100 text-gray-400 cursor-not-allowed">
              เงินไม่พอจ่าย
            </button>
          `;
        }

        card.innerHTML = `
          <div class="flex justify-between items-start gap-2">
            <div class="flex items-center gap-2.5">
              <!-- ปุ่มจุดสำหรับจิ้มลากสลับลำดับ (Drag Handle) -->
              <div class="text-gray-300 hover:text-[#E6007E] text-base cursor-grab select-none px-0.5">
                ⋮⋮
              </div>

              <div>
                <div class="flex items-center gap-2 flex-wrap">
                  <h4 class="font-bold text-sm ${isPaid ? 'line-through text-gray-400' : 'text-gray-900'}">${goal.title}</h4>
                  ${getDueBadgeHtml(goal.dueDate, isPaid)}
                </div>
                <p class="text-xs text-gray-400 mt-0.5">
                  ยอดค่างวด: <span class="font-semibold text-gray-800">฿${goal.target.toLocaleString('th-TH')}</span>
                </p>
              </div>
            </div>

            <div class="flex items-center gap-1.5">
              ${buttonHtml}
              <button onclick="deleteGoal(${goal.id})" class="w-7 h-7 rounded-xl bg-gray-50 hover:bg-rose-50 text-gray-400 hover:text-rose-500 flex items-center justify-center text-sm transition-all">
                &times;
              </button>
            </div>
          </div>

          <!-- Progress Bar -->
          <div class="space-y-1">
            <div class="flex justify-between text-[11px] font-medium">
              <span class="${isPaid || isFull ? 'text-emerald-600 font-semibold' : 'text-gray-500'}">
                ${isPaid ? 'จ่ายเรียบร้อยแล้ว' : `สะสมได้ ฿${filledAmount.toLocaleString('th-TH')}`}
              </span>
              <span class="text-gray-400">${percent}%</span>
            </div>
            <div class="w-full bg-gray-100 rounded-full h-2 overflow-hidden">
              <div class="${isPaid || isFull ? 'bg-emerald-500' : 'bg-[#E6007E]'} h-full rounded-full transition-all duration-500" style="width: ${percent}%"></div>
            </div>
          </div>
        `;

        container.appendChild(card);
      });

      // สรุปผลตัวเลขการเงินภาพรวม
      const pendingTotal = totalTarget - totalPaidAmount;
      const remainingAfterPaid = availableBalance - totalPaidAmount;
      const overallPercent = totalTarget > 0 ? Math.min(100, Math.round((totalPaidAmount / totalTarget) * 100)) : 0;
      
      document.getElementById('netBalanceText').innerText = `฿${availableBalance.toLocaleString('th-TH')}`;
      document.getElementById('remainingAfterPaidText').innerText = `฿${remainingAfterPaid.toLocaleString('th-TH')}`;
      document.getElementById('paidTotalText').innerText = `฿${totalPaidAmount.toLocaleString('th-TH')}`;
      document.getElementById('totalTargetText').innerText = `฿${totalTarget.toLocaleString('th-TH')}`;
      document.getElementById('pendingTotalText').innerText = `฿${pendingTotal.toLocaleString('th-TH')}`;
      
      document.getElementById('totalPercentText').innerText = `${overallPercent}%`;
      document.getElementById('totalProgressBar').style.width = `${overallPercent}%`;
    }

    window.onload = () => {
      const mm = String(selectedDate.getMonth() + 1).padStart(2, '0');
      const yyyy = selectedDate.getFullYear();
      document.getElementById('monthPicker').value = `${yyyy}-${mm}`;

      calculateAndRender();
    };
  </script>
</body>
</html>
