<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  
  <title>วิเคราะห์ - น้องจด</title>
  
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Prompt', sans-serif; background-color: #F8F9FA; }
    .nav-active { color: #E6007E; font-weight: 600; }
    input[type="month"]::-webkit-calendar-picker-indicator {
      cursor: pointer;
      opacity: 0.6;
    }
  </style>
</head>
<body class="max-w-md mx-auto min-h-screen text-gray-800 pb-24">

  <div class="p-4 space-y-4">
    <!-- Top Segmented Control -->
    <div class="bg-gray-100 p-1 rounded-2xl flex text-sm font-medium">
      <button id="tabIncomeExpense" onclick="switchTab('income-expense')" class="flex-1 py-2 rounded-xl bg-white text-gray-800 shadow-sm transition-all text-center">วิเคราะห์การเงิน</button>
    </div>

    <!-- Section 1: ประวัติรายรับรายจ่าย (6 เดือนย้อนหลัง) -->
    <div class="bg-white p-5 rounded-3xl shadow-sm border border-gray-100 space-y-4">
      <div class="flex justify-between items-center">
        <h2 class="font-bold text-lg text-gray-900">ประวัติรายรับรายจ่าย</h2>
        <div class="relative flex items-center bg-gray-50 border border-gray-200 rounded-xl px-2.5 py-1 text-xs font-medium text-gray-600">
          <span class="mr-1">📅</span>
          <input type="month" id="barDatePicker" onchange="onBarDateChange(this.value)" class="bg-transparent focus:outline-none cursor-pointer text-xs text-gray-600">
        </div>
      </div>

      <!-- Range Navigator -->
      <div class="flex justify-between items-center text-xs text-gray-500 font-medium px-2">
        <button class="hover:text-gray-800" onclick="shiftMonth(-1)">&lt;</button>
        <span id="dateRangeText">กำลังโหลด...</span>
        <button class="hover:text-gray-800" onclick="shiftMonth(1)">&gt;</button>
      </div>

      <!-- Bar Chart -->
      <div class="h-48 relative">
        <canvas id="barChart"></canvas>
      </div>

      <p class="text-center text-[11px] text-gray-400">เอานิ้วจิ้มบนกราฟเพื่อดูค่าได้เลย</p>

      <!-- Averages -->
      <div class="grid grid-cols-2 gap-2 pt-2 border-t border-gray-50 text-center">
        <div>
          <p class="text-[11px] text-gray-500 flex items-center justify-center gap-1">
            <span>📅</span> รายจ่ายเฉลี่ยต่อเดือน
          </p>
          <p id="avgExpense" class="text-lg font-bold text-[#E6007E]">฿0</p>
        </div>
        <div>
          <p class="text-[11px] text-gray-500 flex items-center justify-center gap-1">
            <span>📅</span> รายรับเฉลี่ยต่อเดือน
          </p>
          <p id="avgIncome" class="text-lg font-bold text-[#38BDF8]">฿0</p>
        </div>
      </div>
    </div>

    <!-- Section 2: รายจ่ายตามหมวด -->
    <div class="bg-white p-5 rounded-3xl shadow-sm border border-gray-100 space-y-4">
      <div class="flex justify-between items-center">
        <h2 class="font-bold text-lg text-gray-900">รายจ่ายตามหมวด</h2>
        <div class="relative flex items-center bg-gray-50 border border-gray-200 rounded-xl px-2.5 py-1 text-xs font-medium text-gray-600">
          <span class="mr-1">📅</span>
          <input type="month" id="pieDatePicker" onchange="onPieDateChange(this.value)" class="bg-transparent focus:outline-none cursor-pointer text-xs text-gray-600">
        </div>
      </div>

      <!-- Pie Chart -->
      <div class="w-60 h-60 mx-auto relative">
        <canvas id="pieChart"></canvas>
      </div>
    </div>

    <!-- Section 3: สรุปเงินรายอาทิตย์ (แบบเดิม 1-7, 8-14... + ยอดรวมทั้งเดือน ด้านล่างสุด) -->
    <div class="bg-white p-5 rounded-3xl shadow-sm border border-gray-100 space-y-4">
      <div class="flex justify-between items-center">
        <div>
          <h2 class="font-bold text-lg text-gray-900">สรุปรายอาทิตย์</h2>
          <p id="weeklyMonthText" class="text-xs text-gray-400">ประจำเดือน...</p>
        </div>
        <div class="relative flex items-center bg-gray-50 border border-gray-200 rounded-xl px-2.5 py-1 text-xs font-medium text-gray-600">
          <span class="mr-1">📅</span>
          <input type="month" id="weeklyDatePicker" onchange="onWeeklyDateChange(this.value)" class="bg-transparent focus:outline-none cursor-pointer text-xs text-gray-600">
        </div>
      </div>

      <!-- รายการสรุปแต่ละสัปดาห์ -->
      <div id="weeklyContainer" class="space-y-3">
        <p class="text-center text-xs text-gray-400 py-4">กำลังโหลดข้อมูล...</p>
      </div>

      <!-- สรุปรวมยอดทั้งเดือน -->
      <div id="monthlyTotalContainer" class="pt-3 border-t border-gray-100">
        <!-- JS จะสร้างเนื้อหามาใส่ตรงนี้ -->
      </div>
    </div>
  </div>

  <!-- Bottom Navigation Bar -->
  <div class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t border-gray-100 px-6 py-2 flex justify-around items-center z-40 text-center text-[11px] text-gray-400">
    <a href="index.html" class="flex flex-col items-center space-y-1 hover:text-gray-600 flex-1">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 00-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
      <span>สรุป</span>
    </a>
    <a href="analysis.html" class="flex flex-col items-center space-y-1 nav-active flex-1">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
      <span>วิเคราะห์</span>
    </a>
    <a href="goal.html" class="flex flex-col items-center space-y-1 hover:text-gray-600 flex-1">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
      <span>เป้าหมาย</span>
    </a>
  </div>

  <script>
    const WORKER_URL = "https://nongjod.hay-peerapattx-co-th.workers.dev/";
    let barChartInstance = null;
    let pieChartInstance = null;
    let currentDate = new Date();
    const thaiFullMonths = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
    const thaiMonths = ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."];

    function cleanDisplayName(name) {
      if (!name) return "User";
      let cleaned = name.normalize("NFKD");
      cleaned = cleaned.replace(/[^\u0E00-\u0E7F\w\s]/gi, "").trim();
      return cleaned || "User";
    }

    function switchTab(tab) {
      const btn1 = document.getElementById('tabIncomeExpense');
      if (btn1) btn1.className = "flex-1 py-2 rounded-xl bg-white text-gray-800 shadow-sm transition-all text-center font-medium";
    }

    function parseAmount(val) {
      if (!val) return 0;
      const cleanVal = String(val).replace(/,/g, '');
      return parseFloat(cleanVal) || 0;
    }

    function renderBarChart(labels, expenseData, incomeData) {
      const ctx = document.getElementById('barChart').getContext('2d');
      if (barChartInstance) barChartInstance.destroy();

      barChartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [
            {
              label: 'รายจ่าย',
              data: expenseData,
              backgroundColor: '#E6007E',
              borderRadius: 6,
              barThickness: 14
            },
            {
              label: 'รายรับ',
              data: incomeData,
              backgroundColor: '#38BDF8',
              borderRadius: 6,
              barThickness: 14
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              position: 'bottom',
              labels: { font: { family: 'Prompt', size: 12 }, usePointStyle: true, boxWidth: 8 }
            }
          },
          scales: {
            x: { grid: { display: false }, ticks: { font: { family: 'Prompt', size: 10 } } },
            y: { display: false, grid: { display: false } }
          }
        }
      });
    }

    function renderPieChart(categories, amounts) {
      const ctx = document.getElementById('pieChart').getContext('2d');
      if (pieChartInstance) pieChartInstance.destroy();

      const colors = ['#E6007E', '#38BDF8', '#FBBF24', '#10B981', '#9333EA', '#F472B6', '#4B5563', '#581C87'];

      pieChartInstance = new Chart(ctx, {
        type: 'pie',
        data: {
          labels: categories.length ? categories : ['ไม่มีข้อมูล'],
          datasets: [{
            data: amounts.length ? amounts : [1],
            backgroundColor: categories.length ? colors.slice(0, categories.length) : ['#E5E7EB'],
            borderWidth: 2,
            borderColor: '#ffffff'
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              position: 'bottom',
              labels: { font: { family: 'Prompt', size: 11 }, usePointStyle: true, boxWidth: 8 }
            }
          }
        }
      });
    }

    async function fetchSheetData(sheetName) {
      try {
        const res = await fetch(`${WORKER_URL}?sheet=${encodeURIComponent(sheetName)}&_t=${Date.now()}`);
        if (!res.ok) return [];
        const data = await res.json();
        return data.items || [];
      } catch (e) {
        return [];
      }
    }

    function onWeeklyDateChange(val) {
      if (val) {
        const [year, month] = val.split('-');
        currentDate = new Date(year, month - 1, 1);
        loadAnalysisData(currentDate);
      }
    }

    function onBarDateChange(val) {
      if (val) {
        const [year, month] = val.split('-');
        currentDate = new Date(year, month - 1, 1);
        loadAnalysisData(currentDate);
      }
    }

    function onPieDateChange(val) {
      if (val) {
        const [year, month] = val.split('-');
        currentDate = new Date(year, month - 1, 1);
        loadAnalysisData(currentDate);
      }
    }

    function shiftMonth(offset) {
      currentDate.setMonth(currentDate.getMonth() + offset);
      loadAnalysisData(currentDate);
    }

    // ฟังก์ชั่นคำนวณเงินรายสัปดาห์แบบช่วงวันที่คงที่ (1-7, 8-14, 15-21, 22-28, 29-สิ้นเดือน)
    function processWeeklySummary(items, selectedDate) {
      const year = selectedDate.getFullYear();
      const month = selectedDate.getMonth();
      const lastDay = new Date(year, month + 1, 0).getDate();

      const weeks = [
        { label: "อาทิตย์ที่ 1", start: 1, end: 7 },
        { label: "อาทิตย์ที่ 2", start: 8, end: 14 },
        { label: "อาทิตย์ที่ 3", start: 15, end: 21 },
        { label: "อาทิตย์ที่ 4", start: 22, end: 28 },
        { label: "อาทิตย์ที่ 5", start: 29, end: lastDay }
      ];

      let weeklyData = weeks.map(w => ({ ...w, income: 0, expense: 0 }));

      if (Array.isArray(items)) {
        items.forEach(item => {
          let amt = parseAmount(item.amount);
          let type = String(item.type || '').trim().toLowerCase();
          
          let day = 0;
          if (item.date) {
            let parts = item.date.split(/[-/]/);
            if (parts.length >= 3) {
              day = parseInt(parts[0].length === 4 ? parts[2] : parts[0], 10);
            }
          }

          if (day >= 1 && day <= lastDay) {
            let targetWeek = weeklyData.find(w => day >= w.start && day <= w.end);
            if (targetWeek) {
              if (type.includes("รายรับ") || type.includes("รับ") || type.includes("income")) {
                targetWeek.income += amt;
              } else if (amt > 0) {
                targetWeek.expense += amt;
              }
            }
          }
        });
      }

      const container = document.getElementById('weeklyContainer');
      container.innerHTML = '';

      let totalMonthIncome = 0;
      let totalMonthExpense = 0;

      weeklyData.forEach((w) => {
        if (w.start > lastDay) return;

        totalMonthIncome += w.income;
        totalMonthExpense += w.expense;

        let net = w.income - w.expense;
        let isPositive = net >= 0;
        let netColor = isPositive ? "text-emerald-500" : "text-rose-500";
        let netBg = isPositive ? "bg-emerald-50" : "bg-rose-50";
        let statusText = isPositive ? "เหลือเก็บ" : "ใช้เกิน";

        let html = `
          <div class="p-3 rounded-2xl bg-gray-50 flex items-center justify-between border border-gray-100">
            <div>
              <div class="flex items-center gap-2">
                <span class="font-semibold text-sm text-gray-800">${w.label}</span>
                <span class="text-[10px] text-gray-400">(${w.start}-${w.end} ${thaiMonths[month]})</span>
              </div>
              <div class="text-[11px] text-gray-400 mt-0.5">
                รับ ฿${w.income.toLocaleString()} | จ่าย ฿${w.expense.toLocaleString()}
              </div>
            </div>
            <div class="text-right">
              <span class="inline-block px-2 py-0.5 rounded-full text-[10px] font-medium ${netBg} ${netColor}">
                ${statusText} ฿${Math.abs(net).toLocaleString()}
              </span>
            </div>
          </div>
        `;
        container.innerHTML += html;
      });

      // สรุปรวมทั้งเดือน (รวมทุกอาทิตย์เข้าด้วยกัน)
      let totalNet = totalMonthIncome - totalMonthExpense;
      let totalIsPositive = totalNet >= 0;
      let totalStatusText = totalIsPositive ? "เหลือเก็บรวม" : "ใช้เกินรวม";

      const totalContainer = document.getElementById('monthlyTotalContainer');
      totalContainer.innerHTML = `
        <div class="bg-gray-900 text-white p-4 rounded-2xl space-y-2">
          <div class="flex justify-between items-center text-xs text-gray-300">
            <span>สรุปรวมทั้งเดือน (${thaiMonths[month]})</span>
            <span class="font-semibold ${totalIsPositive ? 'text-emerald-400' : 'text-rose-400'}">
              ${totalStatusText} ฿${Math.abs(totalNet).toLocaleString()}
            </span>
          </div>
          <div class="grid grid-cols-2 gap-2 pt-1 border-t border-gray-800 text-xs">
            <div>
              <span class="text-gray-400">รายรับรวม:</span>
              <span class="font-semibold text-[#38BDF8] ml-1">฿${totalMonthIncome.toLocaleString()}</span>
            </div>
            <div class="text-right">
              <span class="text-gray-400">รายจ่ายรวม:</span>
              <span class="font-semibold text-[#E6007E] ml-1">฿${totalMonthExpense.toLocaleString()}</span>
            </div>
          </div>
        </div>
      `;
    }

    async function loadAnalysisData(selectedDate = new Date()) {
      let cleanName = "User";

      try {
        await liff.init({ liffId: "2010951712-Th0lITIH" });
        if (liff.isLoggedIn()) {
          const profile = await liff.getProfile();
          cleanName = cleanDisplayName(profile.displayName);
        } else {
          cleanName = cleanDisplayName("Peerapat");
        }
      } catch (e) {
        cleanName = cleanDisplayName("Peerapat");
      }

      const currentYYYY = selectedDate.getFullYear();
      const currentMM = String(selectedDate.getMonth() + 1).padStart(2, '0');
      const formattedMonth = `${currentYYYY}-${currentMM}`;
      
      document.getElementById('weeklyDatePicker').value = formattedMonth;
      document.getElementById('barDatePicker').value = formattedMonth;
      document.getElementById('pieDatePicker').value = formattedMonth;

      document.getElementById('weeklyMonthText').innerText = `ประจำเดือน ${thaiFullMonths[selectedDate.getMonth()]} ${selectedDate.getFullYear() + 543}`;

      let currentSheet = `${cleanName}_${currentMM}-${currentYYYY}`;
      let currentMonthItems = await fetchSheetData(currentSheet);
      processWeeklySummary(currentMonthItems, selectedDate);

      let monthLabels = [];
      let monthlyExpenses = [];
      let monthlyIncomes = [];
      let allCategoriesMap = {};

      for (let i = 5; i >= 0; i--) {
        let d = new Date(selectedDate.getFullYear(), selectedDate.getMonth() - i, 1);
        let mm = String(d.getMonth() + 1).padStart(2, '0');
        let yyyy = d.getFullYear();
        
        monthLabels.push(`${thaiMonths[d.getMonth()]}`);
        
        let targetSheet = `${cleanName}_${mm}-${yyyy}`;
        let items = (i === 0) ? currentMonthItems : await fetchSheetData(targetSheet);

        let totalInc = 0;
        let totalExp = 0;

        if (Array.isArray(items)) {
          items.forEach(item => {
            let amt = parseAmount(item.amount);
            let type = String(item.type || '').trim().toLowerCase();

            if (type.includes("รายรับ") || type.includes("รับ") || type.includes("income")) {
              totalInc += amt;
            } else if (amt > 0) {
              totalExp += amt;
              if (i === 0) {
                let cat = (item.category || item.note || 'อื่นๆ').trim();
                allCategoriesMap[cat] = (allCategoriesMap[cat] || 0) + amt;
              }
            }
          });
        }

        monthlyIncomes.push(totalInc);
        monthlyExpenses.push(totalExp);
      }

      renderBarChart(monthLabels, monthlyExpenses, monthlyIncomes);

      let activeMonthsCount = 0;
      for (let i = 0; i < 6; i++) {
        if (monthlyExpenses[i] > 0 || monthlyIncomes[i] > 0) {
          activeMonthsCount++;
        }
      }
      if (activeMonthsCount === 0) activeMonthsCount = 1;

      let sumExpense = monthlyExpenses.reduce((a, b) => a + b, 0);
      let sumIncome = monthlyIncomes.reduce((a, b) => a + b, 0);

      let avgExp = Math.round(sumExpense / activeMonthsCount);
      let avgInc = Math.round(sumIncome / activeMonthsCount);

      document.getElementById('avgExpense').innerText = `฿${avgExp.toLocaleString('th-TH')}`;
      document.getElementById('avgIncome').innerText = `฿${avgInc.toLocaleString('th-TH')}`;
      
      let startMonth = monthLabels[0];
      let endMonth = monthLabels[5];
      let currentYearThai = String(selectedDate.getFullYear() + 543).slice(-2);
      document.getElementById('dateRangeText').innerText = `${startMonth} - ${endMonth} ${currentYearThai}`;

      const pieCategories = Object.keys(allCategoriesMap);
      const pieAmounts = Object.values(allCategoriesMap);
      renderPieChart(pieCategories, pieAmounts);
    }

    window.onload = () => loadAnalysisData(currentDate);
  </script>
</body>
</html>
